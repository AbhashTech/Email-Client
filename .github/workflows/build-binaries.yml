name: Build Distribution Binaries

# Manual trigger only — run from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build profile"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - dev

env:
  BIN_NAME: email-ui
  APP_NAME: AT-mail-rs
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            artifact_ext: ""
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-pc-windows-msvc
            artifact_ext: ".exe"
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
            artifact_ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # --- Linux system dependencies (GTK/WebKit/Wayland/X11 stack) ---
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            cmake \
            libssl-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev

      # --- macOS system dependencies ---
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config cmake openssl dbus

      - name: Build (release)
        if: ${{ inputs.build_type != 'dev' }}
        run: cargo build --release --workspace --bin ${{ env.BIN_NAME }} --target ${{ matrix.target }}

      - name: Build (dev)
        if: ${{ inputs.build_type == 'dev' }}
        run: cargo build --workspace --bin ${{ env.BIN_NAME }} --target ${{ matrix.target }}

      - name: Stage binary for upload
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_DIR="release"
          if [ "${{ inputs.build_type }}" = "dev" ]; then
            PROFILE_DIR="debug"
          fi
          SRC="target/${{ matrix.target }}/${PROFILE_DIR}/${{ env.BIN_NAME }}${{ matrix.artifact_ext }}"
          mkdir -p dist
          cp "$SRC" "dist/${{ env.APP_NAME }}-${{ matrix.name }}${{ matrix.artifact_ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.name }}
          path: dist/${{ env.APP_NAME }}-${{ matrix.name }}${{ matrix.artifact_ext }}
          retention-days: 14
          if-no-files-found: error
